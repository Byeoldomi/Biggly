<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별돔 | 링크 모음</title>
  
  <!-- Open Graph (카카오톡, 페이스북, 슬랙 등 SNS 공유 미리보기) -->
  <meta property="og:title" content="별돔 | 링크 모음">
  <meta property="og:description" content="취미로 바이브코딩하는 사람, 별돔의 링크 모음">
  <meta property="og:image" content="assets/og-image.jpg">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="별돔 | 링크 모음">
  <meta name="twitter:description" content="취미로 바이브코딩하는 사람, 별돔의 링크 모음">
  <meta name="twitter:image" content="assets/og-image.jpg">

  <!-- 파비콘 404 에러 방지 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-container">
    <!-- 화면 오른쪽 가장자리 알림 종 버튼 -->
    <button id="notifBtn" class="notification-btn" aria-label="최신 소식 알림">
      <!-- 둥근 형태 종 모양 SVG 아이콘 -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <!-- 오른쪽 상단 대각선 알림 숫자 뱃지 -->
      <span class="notif-badge">1</span>
    </button>

    <main class="content">
      <!-- 1. 프로필 영역 (프로필 이미지 -> 이름 -> 한 줄 소개 순서) -->
      <section class="profile-section">
        <div class="profile-avatar-wrapper">
          <img src="assets/profile.png" alt="별돔 프로필 이미지" class="profile-avatar">
        </div>
        <h1 class="profile-name">별돔</h1>
        <p class="profile-bio">취미로 바이브코딩하는 사람</p>
      </section>

      <!-- 2. 링크 목록 (세로 배치) -->
      <section class="links-section">
        <!-- 메일 링크 -->
        <a href="mailto:byeoldom@gmail.com" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="card-image-wrapper">
            <img src="assets/mail.jpg" alt="메일 대표 이미지" class="card-image">
          </div>
          <div class="card-text-group">
            <h2 class="card-title">이메일</h2>
            <p class="card-subinfo">byeoldom@gmail.com</p>
          </div>
          <div class="card-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </a>

        <!-- 스레드 링크 -->
        <a href="https://www.threads.com/@byeoldom.log" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="card-image-wrapper">
            <img src="assets/threads.jpg" alt="스레드 대표 이미지" class="card-image">
          </div>
          <div class="card-text-group">
            <h2 class="card-title">스레드</h2>
            <p class="card-subinfo">별돔의 최신 소식 구경하기</p>
          </div>
          <div class="card-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </a>

        <!-- 티스토리 블로그 링크 -->
        <a href="https://byeoldomi.tistory.com/" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="card-image-wrapper">
            <img src="assets/blog.jpg" alt="블로그 대표 이미지" class="card-image">
          </div>
          <div class="card-text-group">
            <h2 class="card-title">티스토리 블로그</h2>
            <p class="card-subinfo">개발 스토리 읽어보기</p>
          </div>
          <div class="card-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </a>
      </section>

      <!-- 푸터 -->
      <footer class="footer">
        <p>© 별돔. All rights reserved.</p>
      </footer>
    </main>
  </div>

  <!-- 최신 소식 알림 팝업 모달 -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <h3 class="modal-title">최신 소식</h3>
      </div>
      <div class="modal-body">
        <p class="modal-text">바이브코딩 프로젝트 제작 과정 새로 업데이트됩니다!</p>
      </div>
      <div class="modal-footer">
        <button id="closeModalBtn" class="modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 스크립트: 팝업 모달 제어 -->
  <script>
    const notifBtn = document.getElementById('notifBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 알림 종 아이콘 또는 숫자 클릭 시 팝업 열기
    notifBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('hidden');
    });

    // 닫기 버튼 클릭 시 팝업 닫기
    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
    });

    // 어두운 배경(오버레이) 클릭 시에도 닫히도록 설정
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
